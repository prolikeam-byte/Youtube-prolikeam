# Save as: .github/workflows/render-video.yml
# Renders a Hyperframes project to MP4 on demand via GitHub Actions and uploads it as a downloadable artifact.

name: Render video

on:
  workflow_dispatch:        # Runs only when manually triggered from the Actions tab
    inputs:
      video_dir:
        description: "Folder containing index.html (use '.' for repo root)"
        required: true
        default: "."
        type: string
      output_file:
        description: "Output MP4 filename"
        required: true
        default: "out.mp4"
        type: string

env:
  VIDEO_DIR: ${{ inputs.video_dir }}
  OUTPUT_FILE: ${{ inputs.output_file }}
  HYPERFRAMES_NO_UPDATE_CHECK: "1"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Ensure Hyperframes composition exists
        working-directory: ${{ env.VIDEO_DIR }}
        run: |
          mkdir -p .
          if [ ! -f "index.html" ]; then
            echo "No index.html found. Initializing a starter Hyperframes composition..."
            npx --yes hyperframes init /tmp/hf-starter --non-interactive --example=blank
            cp -rn /tmp/hf-starter/. .
            rm -rf /tmp/hf-starter
          fi

      - name: Check environment
        working-directory: ${{ env.VIDEO_DIR }}
        run: npx --yes hyperframes doctor

      - name: Lint composition
        working-directory: ${{ env.VIDEO_DIR }}
        run: npx --yes hyperframes lint

      - name: Render to MP4
        working-directory: ${{ env.VIDEO_DIR }}
        run: npx --yes hyperframes render --quality high --strict --output "$OUTPUT_FILE"

      - name: Verify output exists
        working-directory: ${{ env.VIDEO_DIR }}
        run: |
          [ -s "$OUTPUT_FILE" ] || { echo "Render produced no output"; exit 1; }
          ffprobe -v error -show_entries format=duration -of default=nw=1 "$OUTPUT_FILE"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: ${{ env.VIDEO_DIR }}/${{ env.OUTPUT_FILE }}
          if-no-files-found: error
          retention-days: 14
