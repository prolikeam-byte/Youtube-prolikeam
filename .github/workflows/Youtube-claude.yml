name: Build and Render Video

on:
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create required folders
        run: |
          mkdir -p input
          mkdir -p assets

      - name: Create placeholder narration if missing
        run: |
          if [ ! -f input/narration.txt ]; then
            cat > input/narration.txt << 'EOF'
          Welcome to this autogenerated YouTube Short.
          This is placeholder narration used by GitHub Actions.
          Replace this file with your own script when ready.
          EOF
          fi

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Node dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          fi

      - name: Run make_short.py
        run: |
          if [ -f make_short.py ]; then
            python make_short.py
          else
            echo "make_short.py not found"
          fi

      - name: Show generated files
        run: |
          find . -type f | sort

      - name: Upload videos
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: |
            *.mp4
            output/*.mp4
            **/*.mp4
          if-no-files-found: warn
