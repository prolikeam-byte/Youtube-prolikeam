name: Build and Render Video

on:
  workflow_dispatch:
    inputs:
      work_dir:
        description: "Folder to run in ('.' for root, or 'Dev')"
        required: true
        default: "Dev"
        type: string
      output_file:
        description: "Output MP4 filename"
        required: true
        default: "out.mp4"
        type: string

env:
  WORK_DIR: ${{ inputs.work_dir }}
  OUTPUT_FILE: ${{ inputs.output_file }}
  HYPERFRAMES_NO_UPDATE_CHECK: "1"

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Ensure working directory and assets exist
        run: |
          mkdir -p "${{ env.WORK_DIR }}/assets"

          if ! compgen -G "${{ env.WORK_DIR }}/assets/*.png" > /dev/null; then
            echo "No PNGs found. Generating placeholder slides..."

            ffmpeg -y -f lavfi -i color=c=#1e293b:s=1080x1920 -frames:v 1 \
              "${{ env.WORK_DIR }}/assets/scene_01.png"

            ffmpeg -y -f lavfi -i color=c=#0f172a:s=1080x1920 -frames:v 1 \
              "${{ env.WORK_DIR }}/assets/scene_02.png"

            ffmpeg -y -f lavfi -i color=c=#334155:s=1080x1920 -frames:v 1 \
              "${{ env.WORK_DIR }}/assets/scene_03.png"
          fi

      - name: Install Python dependencies
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          elif [ -f ../requirements.txt ]; then
            pip install -r ../requirements.txt
          fi

      - name: Install Node dependencies
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      - name: Run make_short.py
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if [ -f make_short.py ]; then
            python make_short.py
          elif [ -f assets/make_short.py ]; then
            python assets/make_short.py
          elif [ -f ../make_short.py ]; then
            python ../make_short.py
          else
            echo "No make_short.py found. Continuing..."
          fi

      - name: Ensure Hyperframes composition exists
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if [ ! -f index.html ]; then
            echo "No index.html found. Initialising starter composition..."

            npx --yes hyperframes init /tmp/hf-starter \
              --non-interactive \
              --example=blank

            cp -
