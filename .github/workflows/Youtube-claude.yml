name: Create YouTube Short

on:
  workflow_dispatch:

jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: Dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Show project structure
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          find . -type f | sort

      - name: Verify assets
        run: |
          echo "Assets folder contents:"
          ls -la assets

          PNG_COUNT=$(find assets -name "scene_*.png" | wc -l)

          echo "Found $PNG_COUNT scene images"

          if [ "$PNG_COUNT" -eq 0 ]; then
            echo "ERROR: No scene images found"
            exit 1
          fi

      - name: Verify narration
        run: |
          mkdir -p input

          if [ ! -f input/narration.txt ]; then
            echo "Placeholder narration for testing." > input/narration.txt
          fi

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run make_short.py
        run: |
          python make_short.py

      - name: Upload output files
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: |
            Dev/output/**
            Dev/*.mp4
          if-no-files-found: warn
