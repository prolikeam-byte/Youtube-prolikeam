name: Create YouTube Short

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "eSpeak voice"
        required: true
        default: "en+f3"

jobs:
  create-short:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dev

    env:
      VOICE: ${{ inputs.voice }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Run make_short.py
        run: |
          echo "Using voice: $VOICE"
          python make_short.py
