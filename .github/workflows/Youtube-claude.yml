name: Create YouTube Short

on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Voice name"
        required: true
        default: "en-IN-PrabhatNeural"

jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: Dev

    env:
      VOICE: ${{ inputs.voice }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            espeak \
            espeak-ng \
            libespeak-ng1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install \
            numpy \
            pyttsx3 \
            pillow \
            moviepy \
            imageio \
            imageio-ffmpeg \
            pydub \
            scipy \
            tqdm

      - name: Verify pyttsx3 installation
        run: |
          python -m pip show pyttsx3

      - name: Verify assets
        run: |
          ls -la assets

      - name: Ensure narration file exists
        run: |
          mkdir -p input

          if [ ! -f input/narration.txt ]; then
            echo "This is a sample narration." > input/narration.txt
          fi

      - name: Run make_short.py
        run: |
          echo "Using voice: $VOICE"
          python make_short.py

      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: |
            Dev/output/**
            Dev/*.mp4
          if-no-files-found: warn
          retention-days: 14
