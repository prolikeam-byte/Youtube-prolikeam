name: Build and Render Video

on:
  workflow_dispatch:
    inputs:
      work_dir:
        description: "Folder to run in ('.' for root, or 'Dev')"
        required: true
        default: "Dev"
        type: string
      output_file:
        description: "Output MP4 filename"
        required: true
        default: "out.mp4"
        type: string

env:
  WORK_DIR: ${{ inputs.work_dir || 'Dev' }}
  OUTPUT_FILE: ${{ inputs.output_file || 'out.mp4' }}
  HYPERFRAMES_NO_UPDATE_CHECK: "1"

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Ensure working directory and assets exist
        run: |
          mkdir -p "${{ env.WORK_DIR }}/assets"
          if [ -z "$(ls -A "${{ env.WORK_DIR }}/assets"/*.png 2>/dev/null)" ]; then
            echo "No PNGs found in ${{ env.WORK_DIR }}/assets/. Generating 3 dummy vertical slides..."
            ffmpeg -y -f lavfi -i color=c=#1e293b:s=1080x1920 -frames:v 1 "${{ env.WORK_DIR }}/assets/scene_01.png"
            ffmpeg -y -f lavfi -i color=c=#0f172a:s=1080x1920 -frames:v 1 "${{ env.WORK_DIR }}/assets/scene_02.png"
            ffmpeg -y -f lavfi -i color=c=#334155:s=1080x1920 -frames:v 1 "${{ env.WORK_DIR }}/assets/scene_03.png"
          fi

      - name: Install Python dependencies
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "../requirements.txt" ]; then
            pip install -r ../requirements.txt
          fi

      - name: Run make_short.py
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if [ -f "make_short.py" ]; then
            python make_short.py
          elif [ -f "assets/make_short.py" ]; then
            python assets/make_short.py
          elif [ -f "../make_short.py" ]; then
            python ../make_short.py
          fi

      - name: Ensure Hyperframes composition exists
        working-directory: ${{ env.WORK_DIR }}
        run: |
          if [ ! -f "index.html" ]; then
            echo "No index.html found. Initializing a starter Hyperframes composition..."
            npx --yes hyperframes init /tmp/hf-starter --non-interactive --example=blank
            cp -rn /tmp/hf-starter/. .
            rm -rf /tmp/hf-starter
          fi

      - name: Check Hyperframes environment
        working-directory: ${{ env.WORK_DIR }}
        run: npx --yes hyperframes doctor

      - name: Lint Hyperframes composition
        working-directory: ${{ env.WORK_DIR }}
        run: npx --yes hyperframes lint

      - name: Render Hyperframes composition to MP4
        working-directory: ${{ env.WORK_DIR }}
        run: npx --yes hyperframes render --quality high --strict --output "$OUTPUT_FILE"

      - name: Upload generated videos
        uses: actions/upload-artifact@v4
        with:
          name: rendered-videos
          path: |
            ${{ env.WORK_DIR }}/*.mp4
            ${{ env.WORK_DIR }}/output/*.mp4
          if-no-files-found: warn
          retention-days: 14
