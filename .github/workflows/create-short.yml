
name: Create YouTube Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Development branch
        uses: actions/checkout@v4
        with:
          ref: Development

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak espeak-ng

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate video
        run: python make_short.py

      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: output/short.mp4
          if-no-files-found: error
          retention-days: 7
